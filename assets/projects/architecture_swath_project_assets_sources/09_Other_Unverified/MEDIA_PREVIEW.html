<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Unverified — Project Media Assets</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 32px 24px;
        }
        .header {
            max-width: 1400px;
            margin: 0 auto 32px auto;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 8px 0;
            color: var(--accent);
        }
        .status-tag {
            display: inline-block;
            background: #0369a1;
            color: #e0f2fe;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .summary-bar {
            display: flex;
            gap: 24px;
            margin-top: 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .summary-bar strong {
            color: var(--text);
        }
        .grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.5);
            border-color: var(--accent);
        }
        .img-wrapper {
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #020617;
        }
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .card:hover .img-wrapper img {
            transform: scale(1.04);
        }
        .card-info {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }
        .badge {
            background: var(--accent);
            color: #0f172a;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .filename {
            color: var(--text);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .filesize {
            color: var(--text-muted);
            margin-left: auto;
        }
        .sources-section {
            max-width: 1400px;
            margin: 40px auto 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .sources-section h3 {
            margin-top: 0;
            color: var(--accent);
        }
        ul {
            margin: 0;
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
        }
        a {
            color: #7dd3fc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Other Unverified</h1>
        <span class="status-tag">Keep separate until the studio confirms project names and ownership</span>
        <div class="summary-bar">
            <div>Downloaded Local Assets: <strong>0 files</strong></div>
            <div>Folder: <code>09_Other_Unverified/downloaded_images/</code></div>
        </div>
    </div>

    <div class="grid">
        <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No downloaded local image files for this project.</p>
    </div>

    
</body>
</html>
